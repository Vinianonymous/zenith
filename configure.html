<!DOCTYPE html>
<html>
    <head>
        <title>Zenith - Configure</title>
        <link href="style.css" rel="stylesheet">
    </head>

    <body>
        <header>
            <h1>Zenith</h1>
        </header>
        <nav>
            <a href="index.html">Home</a>
            <a class="current">Configure</a>
        </nav>

        <main>
            <div id="settings-container">
                <h2>Settings</h2>
                
                <div class="setting-item">
                    <label for="cycle-interval">Cycle Interval (minutes):</label>
                    <input type="number" id="cycle-interval" name="cycle-interval" min="1">
                    <label for="cycle-path">Cycle Alarm Path</label>
                    <input type="text" id="cycle-alarm-path">
                    <label for="tickingEnable">Ticking sound Enabled</label>
                    <input type="checkbox" name="tickingEnable" id="tickingEnable">
                    <label for="tickingPath">Ticking Sound File Path</label>
                    <input type="text" name="tickingPath" id="tickingSoundPath">
                </div> <!--TODO: GET A TICKING SOUND MP3-->
                <button id="save-btn">Save</button>
            </div>
        </main>
        <script type="module" src="configure.js"></script>
    </body>
</html>
