<!DOCTYPE html>
<html>
    <head>
        <title>Zenith</title>
        <link href="../styles/style.css" rel="stylesheet">
        <script type="module" src="../src/components/TaskItem.js"></script>
    </head>

    <body>
        <dialog id="add-task-dialog">
            <h2>Add Task</h2>
            <form id="add-task-form">
                <label for="task-title">Title:</label>
                <input type="text" id="task-title" name="task-title" required><br><br>

                <label for="task-description">Description:</label>
                <textarea id="task-description" name="task-description"></textarea><br><br>

                <label for="task-due-date">Due Date:</label>
                <input type="date" id="task-due-date" name="task-due-date"><br><br>

                <button type="submit">Add Task</button>
                <button type="button" id="cancel-button">Cancel</button>
            </form>
        </dialog>
        <dialog id="cycle-message-dialog">
            <div>
                <div id="message-container"></div>
                <button id="ack-btn">Acknowledge</button>
            </div>
        </dialog>
        
        <header>
            <h1>Zenith</h1>
        </header>
        <nav>
            <a class="current">Home</a>
            <a href="/pages/statistics.html">Statistics</a>
            <a href="/pages/configure.html">Configure</a>
        </nav>

        <main>
            <div id="stopwatch-container">
                <div id="stopwatch-text">00:00:00</div> <button id="reset-btn">Reset</button>
            </div>

            <div id="task-list">
                <h2>Tasks</h2>
                <div id="task-items">
                    <task-item title="Sample Task"></task-item>
                </div>
            </div>
            
            <br>

            <div id="buttons">
                <button id="add-task-button">Add Task</button>
            </div>
        </main>
    </body>

    <script type="module" src="../src/main.js"></script>
</html>
