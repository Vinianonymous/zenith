<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zenith</title>
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <h1>Zenith</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="goals.html">Goals</a>
        <a class="actual">Settings</a>
        <a href="about.html">About Zenith</a>
      </nav>
    </header>

    <main>
      <form id="settings">
        <div>
          <label for="cycle-enabled">Cycle Enabled</label>
          <input type="checkbox" id="cycle-enabled" name="cycleEnabled" />
        </div>
        <div>
          <label for="cycle-period">Cycle Period (minutes)</label>
          <input
            type="number"
            id="cycle-period"
            name="cyclePeriod"
            min="1"
            step="1"
          />
        </div>
        <div>
          <label for="intercycle-period">Intercycle Period (minutes)</label>
          <input
            type="number"
            id="intercycle-period"
            name="intercyclePeriod"
            min="1"
            step="1"
          />
        </div>
        <div>
          <label for="intercycle-messages"
            >Intercycle Messages (Separate by newline)</label
          >
          <textarea
            name="intercycle-messages"
            id="intercycle-messages"
          ></textarea>
        </div>
        <div>
          <label for="alarm-enabled">Alarm enabled</label>
          <input name="alarm-enabled" type="checkbox" id="alarm-enabled" />
          <label for="alarm-sound">Alarm sound (file path)</label>
          <input type="text" id="alarm-sound" name="alarmSound" />
        </div>
        <button>Save</button>
      </form>
    </main>
    <script type="module" src="settings-page.js"></script>
    <footer></footer>
  </body>
</html>
